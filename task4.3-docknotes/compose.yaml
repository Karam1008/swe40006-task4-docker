# SWE40006 Task 4.3 - DockNotes deployment
#   proxy (Caddy)  -> the only service that publishes ports to the host
#   web (FastAPI)  -> reachable only from the proxy, on the frontend network
#   redis          -> reachable only from web, on an internal backend network
name: docknotes

services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"      # override in .env if port 80 is taken on the host
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # TLS certificates survive container recreation
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [frontend]

  web:
    image: ${DOCKERHUB_USER:?Set DOCKERHUB_USER in .env}/swe40006-docknotes:${APP_VERSION:-1.0.0}
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      MAX_NOTES: ${MAX_NOTES:-25}
      REDIS_HOST: redis        # Docker's embedded DNS resolves the service name
      REDIS_PORT: "6379"
    expose:
      - "8000"                 # documented only; NOT published to the host
    depends_on:
      redis:
        condition: service_healthy
    networks: [frontend, backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data       # notes persist across container recreation
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend]

networks:
  frontend: {}
  backend:
    internal: true             # no route to or from the outside world

volumes:
  redis_data: {}
  caddy_data: {}
  caddy_config: {}
